generated: '2026-08-13'
method: probed
source: live probes of the getcacheflow.com estate on 2026-08-13
note: >-
  Cacheflow was acquired by HubSpot in 2024 and folded into HubSpot Commerce / CPQ. This
  lifecycle record captures the unusual end-state measured on 2026-08-13: the DEVELOPER
  PORTAL and the machine-readable contract are still publicly served, while every runtime
  host has been withdrawn. The contract outlived the API.

versioning:
  scheme: uri-path-rolling
  current: latest
  path_prefix: /api/latest
  spec_version: 0.0.3
  pinned_versions: false
  docs: https://developer.getcacheflow.com/reference
  note: >-
    All 305 paths sit under /api/latest. There is no dated or numbered version segment a
    client can pin to, so there was never a mechanism to hold an old version through a
    breaking change.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: unknown
  deprecation_header: unknown
  note: >-
    No deprecation or sunset policy is published anywhere on the surviving surface. Three
    operations carry `deprecated: true` in the contract itself, which is the only
    deprecation signal the provider shipped.

deprecated_operations:
- operation: openapi/cacheflow-api-openapi.yml#getRefundEvents
  method: GET
  path: /api/latest/data/refunds/{refundId}/events
- operation: openapi/cacheflow-api-openapi.yml#getConnectedSalesforceUser
  method: GET
  path: /api/latest/data/salesforce/me
- operation: openapi/cacheflow-api-openapi.yml#triggerTransferRequest
  method: GET
  path: /api/latest/data/transfer-requests/{transfer-id}/trigger

status_page: null
status_page_note: >-
  status.getcacheflow.com does not resolve (NXDOMAIN, probed 2026-08-13). No status page
