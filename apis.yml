    The following canonical pointers are NOT emitted because the underlying thing genuinely
    does not exist on Cacheflow's surface, and emitting them would be fabrication: SDKs (no
    client library on any registry), Idempotency (zero occurrences of "idempoten" in the
    400-operation contract), StatusPage (status.getcacheflow.com is NXDOMAIN), Deprecation
    (no policy published; only 3 in-spec deprecated flags), Security and
    VulnerabilityDisclosure (no security.txt, no disclosure page, no bug bounty),
    Compliance and TrustCenter (trust./security. subdomains are NXDOMAIN), WellKnown and
    SecurityTxt (every /.well-known/ path 404s — see well-known/cacheflow-well-known.yml,
    which records the absence), AgentCard (agent-card.json and agent.json 404 on every
    resolving host), AsyncAPI (a webhook surface exists but no AsyncAPI document was ever
    published), ChangeLog (the ReadMe project has the changelog module disabled), CLI (the
    oclif client was never released to a registry), Postman, Roadmap, Blog, Support,
    Pricing, SignUp, TermsOfService and PrivacyPolicy (all of those pages now 301 to
    HubSpot and are HubSpot's, not Cacheflow's).
