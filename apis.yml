apis:
- name: Cacheflow API
  description: >-
    REST API for the full Cacheflow quote-to-cash surface: proposals (quotes) and proposal items, product
    catalog and versioning, customers and contacts, subscriptions and change/renewal proposals, billing
    schedules and usage metering, invoices, payments, transfers and refunds, approval workflows, e-signature
    via DocuSign, webhooks, and outbound integrations with Salesforce, HubSpot, Close, QuickBooks, Stripe,
    Plaid and Slack. OpenAPI 3.0.1 with 305 paths, 400 uniquely-identified operations and 407 component
    schemas. Authentication is a static per-organization bearer token plus a mandatory tenant Host header.
    The contract remains published; the API host no longer resolves.
