name: Cacheflow
description: 'Cacheflow was a B2B SaaS billing, CPQ (configure-price-quote), and subscription-management
  platform that let software companies build interactive deal rooms, automate quote-to-cash, and offer
  buyers flexible payment and financing options. Founded in 2020 and backed by GGV Capital and GV, Cacheflow
  was acquired by HubSpot in 2024 and folded into HubSpot Commerce / HubSpot CPQ. The company shipped a
  substantial REST API — 305 paths and 400 operations across proposals, products, customers, subscriptions,
  billing schedules, usage, invoices, payments, refunds, approvals, e-signature and CRM/accounting
  integrations — and that contract is still publicly published: developer.getcacheflow.com serves a live
  ReadMe developer portal with an llms.txt and an OpenAPI 3.0.1 definition. The runtime is gone. As of
  2026-08-13 api.getcacheflow.com, api.sandbox.getcacheflow.com, checkout, status and help all return
  NXDOMAIN, and getcacheflow.com 301-redirects to HubSpot''s Commerce CPQ page. This profile therefore
  records a rare shape: a fully published, machine-readable API contract that outlived the API it described.'
url: https://raw.githubusercontent.com/api-evangelist/cacheflow/refs/heads/main/apis.yml
x-type: company
x-source: vc-portfolio
x-backed-by:
- ggv-capital
- gv
x-tier: profiled
x-tier-reason: published-contract-harvested
x-status: acquired
x-acquired-by: hubspot
x-acquired-note: 'getcacheflow.com 301-redirects to https://www.hubspot.com/products/commerce/cpq (HubSpot
  Commerce / CPQ). The standalone developer portal at developer.getcacheflow.com is still live and still
  serves the OpenAPI and llms.txt, but every runtime host (api., api.sandbox., app.sandbox., checkout.,
  status., help., docs.) returns NXDOMAIN as of 2026-08-13.'
