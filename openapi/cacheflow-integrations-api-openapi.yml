components:
  schemas:
    InvoiceLite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
        status:
          type: string
          enum:
          - draft
          - open
          - paid
          - past_due
          - voided
        invoiceNumber:
          type: string
        eventDetails:
          type: array
          items:
            $ref: '#/components/schemas/SyncEventDetail'
    ReconciliationSummaryRest:
      required:
      - totalSchedulesFailed
      - totalSchedulesSynced
      - totalTransfersFailed
      - totalTransfersSynced
      type: object
      properties:
        totalSchedulesSynced:
          type: integer
          format: int64
        totalSchedulesFailed:
          type: integer
          format: int64
        totalTransfersSynced:
          type: integer
          format: int64
        totalTransfersFailed:
          type: integer
          format: int64
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
        name:
          type: string
        type:
          type: string
        streetAddress:
          type: string
        subAddress:
          type: string
        otherAddress:
          type: string
        city:
          type: string
        region:
          type: string
        regionIso:
          type: string
        postalCode:
          type: string
        country:
          type: string
        countryIso:
          type: string
        verifiedAt:
          type: string
          format: date-time
    Connectors:
      type: object
      properties:
        integrations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConnectorTestResult'
    ReferenceIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
        referenceKey:
          $ref: '#/components/schemas/ReferenceKey'
        sourceType:
          type: string
          enum:
          - manual
          - close
          - plaid
          - stripe
          - hubspot
          - salesforce
          - avalara
          - quickbooks
          - profitwell
          - netsuite
          - google
          - warmly
          - zapier
          - cacheflow_checkout
        count:
          type: integer
          format: int32
        issueType:
          type: string
          enum:
          - address_verification_issue
          - external_duplication
          - external_connector_setup
          - missing_data
          - connector_authentication
          - system_error
    BillingScheduleSyncSummary:
      required:
      - createdAt
      - createdBy
      - id
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        id:
          type: string
          format: uuid
        contractReference:
          $ref: '#/components/schemas/ObjectReference'
        invoiceReference:
          $ref: '#/components/schemas/ObjectReference'
        customerReference:
          $ref: '#/components/schemas/ObjectReference'
        scheduleDate:
          type: string
          format: date
        eventDetails:
          type: array
          items:
            $ref: '#/components/schemas/SyncEventDetail'
        lastEvent:
          $ref: '#/components/schemas/SyncEvent'
        lastSuccessAfterScheduleUpdate:
          $ref: '#/components/schemas/SyncEvent'
        orgId:
          $ref: '#/components/schemas/OrgId'
        orgName:
          type: string
    AttachableRef:
      type: object
      properties:
        EntityRef:
          $ref: '#/components/schemas/QuickbooksReference'
        LineInfo:
          type: string
        IncludeOnSend:
          type: boolean
        CustomField:
          type: array
          items:
            $ref: '#/components/schemas/QuickbooksCustomField'
    ExternalObjectReference:
      type: object
      properties:
        referenceType:
          type: string
          enum:
          - account
          - apiwebhook
          - apitoken
          - approvalgroup
          - attachmentconfig
          - authidentity
          - billingschedule
          - companyInfo
          - connectorSyncEvent
          - contact
          - contentTemplate
          - contract
          - contractitem
          - contractitemlevel
          - currency
          - customer
          - docusignaccount
          - document
          - documentversion
          - group
          - invite
          - invoice
          - invoiceConfiguration
          - organization
          - orgconfig
          - orgidentitytoken
          - payment
          - paymentMethod
          - paymentSchedule
          - paymentTerm
          - pricebook
          - pricebookentry
          - product
          - productlevel
          - productusage
          - proposal
          - proposalapprovalrule
          - proposalevent
