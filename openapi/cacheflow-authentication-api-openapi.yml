openapi: 3.2.0
info:
  title: Cacheflow Authentication API
  version: 0.0.3
servers:
- url: https://api.getcacheflow.com
  description: 'Production. Calls are tenant-routed: send Host: <org-flow-domain>.api.getcacheflow.com (per github.com/getcacheflow/api-examples SETUP.md). Host no longer resolves as of 2026-08-13.'
- url: https://api.sandbox.getcacheflow.com
  description: Sandbox. Tenant-routed as <org-flow-domain>.api.sandbox.getcacheflow.com. Host no longer resolves as of 2026-08-13.
tags:
- name: Authentication
paths:
  /api/latest/sso/providers:
    get:
      tags:
      - Authentication
      summary: List SSO Providers
      operationId: getProviderList
      parameters:
      - name: email
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SsoProvider'
components:
  schemas:
    SsoProvider:
      required:
      - enabled
      - id
      - path
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        enabled:
          type: boolean
